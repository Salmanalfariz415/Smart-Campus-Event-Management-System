<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../static/css/register.css">

    <title>Organizer Registration - CampusConnect</title>
</head>
<body id="organizer-register-page" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-700 via-indigo-800 to-blue-900 font-sans p-4 md:p-8">

    <button class="back-btn fixed top-4 left-5 z-50" onclick="window.location.href='./home.html'">
    <svg height="16" width="16" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1024 1024"><path d="M874.690416 495.52477c0 11.2973-9.168824 20.466124-20.466124 20.466124l-604.773963 0 188.083679 188.083679c7.992021 7.992021 7.992021 20.947078 0 28.939099-4.001127 3.990894-9.240455 5.996574-14.46955 5.996574-5.239328 0-10.478655-1.995447-14.479783-5.996574l-223.00912-223.00912c-3.837398-3.837398-5.996574-9.046027-5.996574-14.46955 0-5.433756 2.159176-10.632151 5.996574-14.46955l223.019353-223.029586c7.992021-7.992021 20.957311-7.992021 28.949332 0 7.992021 8.002254 7.992021 20.957311 0 28.949332l-188.073446 188.073446 604.753497 0C865.521592 475.058646 874.690416 484.217237 874.690416 495.52477z"></path></svg>
    <span>Back</span>
    </button>

    <div class="bg-white w-full max-w-3xl p-6 md:p-10 rounded-2xl shadow-2xl my-8">
        <div class="text-center mb-9">
            <h2 class="text-4xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent mb-2">
                Organizer Registration
            </h2>
            <p class="text-gray-600 text-base">Join as an event organizer on CampusConnect</p>
        </div>

        <div id="alert" class="hidden mb-4 p-3 rounded text-sm"></div>

        <div id="successMessage" class="hidden mb-4 p-3 bg-green-100 text-green-700 rounded text-sm">
            Registration successful! Redirecting...
        </div>

        <form class="space-y-6">
            <!-- Organization Information -->
            <div class="border-b border-gray-200 pb-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                    <span class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center mr-3 text-sm">1</span>
                    Organization Details
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Organization Name <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            id="org_name"
                            placeholder="e.g., Tech Club, Cultural Society"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                        />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Organization Type <span class="text-red-500">*</span>
                        </label>
                        <select
                            id="org_type"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                        >
                            <option value="">Select Type</option>
                            <option value="student_club">Student Club</option>
                            <option value="department">Department</option>
                            <option value="society">Society</option>
                            <option value="committee">Committee</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Organization Description
                    </label>
                    <textarea
                        id="org_description"
                        placeholder="Brief description of your organization"
                        rows="3"
                        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                    ></textarea>
                </div>
            </div>

            <!-- Contact Person Details -->
            <div class="border-b border-gray-200 pb-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                    <span class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center mr-3 text-sm">2</span>
                    Contact Person
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Full Name <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            id="contact_name"
                            placeholder="Enter full name"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                        />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Position/Role <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            id="contact_position"
                            placeholder="e.g., President, Coordinator"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                        />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Email Address <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="email"
                            id="email"
                            placeholder="organization@campus.edu"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                        />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Phone Number <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="+1 (555) 123-4567"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                        />
                    </div>
                </div>
            </div>

            <!-- Account Credentials -->
            <div class="pb-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                    <span class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center mr-3 text-sm">3</span>
                    Account Credentials
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Username <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            id="username"
                            placeholder="Choose a username"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                        />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Password <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Minimum 8 characters"
                            required
                            minlength="8"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200"
                        />
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Confirm Password <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="password"
                            id="confirm_password"
                            placeholder="Re-enter password"
                            required
                            minlength="8"
                            class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-500"
                        />
                    </div>
                </div>
            </div>

            <!-- Terms and Submit -->
            <div class="space-y-4">
                <div class="flex items-start">
                    <input
                        type="checkbox"
                        id="terms"
                        required
                        class="mt-1 mr-2 h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded"
                    />
                    <label for="terms" class="text-sm text-gray-700">
                        I agree to the <a href="#" class="text-purple-600 hover:text-purple-800 font-medium">Terms & Conditions</a> 
                        and <a href="#" class="text-purple-600 hover:text-purple-800 font-medium">Privacy Policy</a>
                    </label>
                </div>

                <button
                    type="submit"
                    id="submit_organizer"
                    class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg hover:from-purple-700 hover:to-indigo-700 transition-all duration-200 font-semibold shadow-lg hover:shadow-xl transform hover:scale-[1.02] active:scale-[0.98]"
                >
                    Register as Organizer
                </button>

                <p class="text-center text-sm text-gray-600">
                    Already have an account?
                    <a href="login.html" class="text-purple-600 hover:text-purple-800 font-medium">Login here</a>
                </p>
            </div>
        </form>
    </div>

    <script src="../static/js/user.js" defer></script>

</body>
</html>
