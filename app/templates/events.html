<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
    <script src="../static/js/event.js" defer></script>
    <link rel="stylesheet" href="../static/css/style2.css">
</head>

<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 overflow-x-hidden">
    <!-- Navigation Bar -->
    <div class="nav grid grid-cols-7 fixed top-0 left-0 w-full h-16 bg-gradient-to-r from-slate-900 to-indigo-950 text-white shadow-lg z-50">
        <div id="logo" class="col-span-1 bg-gradient-to-br from-indigo-600 to-purple-600 flex justify-center items-center">
            <img src="../static/images/logo.png" class="h-9 w-30">
        </div>
        <div class="col-span-1"></div>
        <div class="col-span-1"></div>
        <div></div>
        <a class="col-span-1 pt-5 hover:text-cyan-400 transition-colors duration-300 font-semibold" href="./home.html">Home</a>
        <h1 class="col-span-1 pt-5 hover:text-cyan-400 transition-colors duration-300 font-semibold cursor-pointer">Categories</h1>
        <a href="./addEvent.html" class="col-span-1 pt-5 hover:text-cyan-400 transition-colors duration-300 font-semibold">Organizer Access</a>
    </div>

    <!-- Search Bar -->
    <div class="grid grid-cols-3 items-center search relative mt-16 h-28 w-full bg-gradient-to-r from-slate-50 to-indigo-50 pt-3 shadow-md">
        <button class="mx-10 btn col-span-1 h-10 mt-5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold rounded-lg hover:from-purple-700 hover:to-indigo-700 shadow-md transition-all duration-300 hover:shadow-lg">Filter</button>
        <div class="col-span-2 flex justify-start item-center">
            <div class="form-control mx-5">
                <input class="text-black input input-alt h-16 rounded-xl px-2 border-2 border-indigo-400 w-[35rem] focus:border-purple-500 focus:ring-2 focus:ring-purple-300 transition-all duration-300" placeholder="Search For Events" required="" type="text">
                <span class="input-border input-border-alt"></span>
            </div>
            <button class="submit bg-gradient-to-r from-cyan-500 to-teal-500 h-10 w-24 rounded-xl text-xl text-white font-bold mt-3 hover:from-cyan-600 hover:to-teal-600 shadow-md hover:shadow-lg transition-all duration-300">Submit</button>
        </div>
    </div>

    <!-- Slider Section -->
    <div class="section1 w-full overflow-hidden relative bg-gradient-to-br from-slate-100 to-indigo-100 h-[35rem] pt-4">
        <div id="slider" class="flex transition-transform duration-500 ease-in-out">
            <div class="min-w-full h-[33rem] px-4">
                <div class="w-full h-full flex items-center justify-center text-4xl text-white bg-gradient-to-br from-cyan-500 via-blue-600 to-indigo-700 rounded-xl shadow-2xl">
                    Tech Fest
                </div>
            </div>

            <div class="min-w-full h-[33rem] px-4">
                <div class="w-full h-full flex items-center justify-center text-4xl text-white bg-gradient-to-br from-pink-500 via-purple-600 to-indigo-700 rounded-xl shadow-2xl">
                    Cultural Night
                </div>
            </div>

            <div class="min-w-full h-[33rem] px-4">
                <div class="w-full h-full flex items-center justify-center text-4xl text-white bg-gradient-to-br from-emerald-500 via-teal-600 to-cyan-700 rounded-xl shadow-2xl">
                    Hackathon
                </div>
            </div>
        </div>

        <button onclick="prev()" class="absolute left-5 top-1/2 -translate-y-1/2 text-4xl text-white bg-black/30 hover:bg-black/50 rounded-full w-14 h-14 flex items-center justify-center hover:scale-110 transition-all duration-300 backdrop-blur-sm">❮</button>
        <button onclick="next()" class="absolute right-5 top-1/2 -translate-y-1/2 text-4xl text-white bg-black/30 hover:bg-black/50 rounded-full w-14 h-14 flex items-center justify-center hover:scale-110 transition-all duration-300 backdrop-blur-sm">❯</button>
    </div>

    <!-- Upcoming Events Section -->
    <section class="p-8 bg-gradient-to-br from-slate-50 via-indigo-50 to-purple-50 min-h-screen">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">Upcoming Events</h2>
            </div>

            <div id="eventsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <p class="col-span-full text-center text-indigo-600 animate-pulse font-semibold">
                    Fetching events from the database...
                </p>
            </div>
        </div>
    </section>

    <!-- Slider Script -->
    <script>
        let currentIndex = 0;
        const slider = document.getElementById('slider');
        const totalSlides = slider.children.length;

        function updateSlider() {
            slider.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        function next() {
            currentIndex = (currentIndex + 1) % totalSlides;
            updateSlider();
        }

        function prev() {
            currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
            updateSlider();
        }
    </script>

    <!-- Enhanced Event Overlay -->
    <div id="eventOverlay" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[9998] flex items-center justify-center p-4">
        <div class="bg-gradient-to-br from-white to-indigo-50 rounded-2xl relative shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <button id="closeOverlay" class="absolute top-4 right-4 text-gray-500 hover:text-red-600 text-2xl font-bold transition-colors duration-300 z-10 bg-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg">✕</button>
            
            <!-- Event Header -->
            <div id="overlayHeader" class="h-32 bg-gradient-to-r from-purple-500 via-pink-500 to-rose-500 rounded-t-2xl relative overflow-hidden">
                <div class="absolute inset-0 opacity-20">
                    <div class="absolute top-0 left-0 w-24 h-24 bg-white rounded-full -translate-x-12 -translate-y-12"></div>
                    <div class="absolute bottom-0 right-0 w-32 h-32 bg-white rounded-full translate-x-16 translate-y-16"></div>
                </div>
                <div class="relative p-6 flex items-end justify-between">
                    <div>
                        <span id="overlayCategory" class="px-3 py-1 text-xs font-semibold rounded-full bg-white/95 text-purple-600 shadow-lg"></span>
                        <h2 id="overlayTitle" class="text-2xl font-bold text-white mt-2 drop-shadow-lg"></h2>
                    </div>
                    <span id="overlayFee" class="px-3 py-1 text-sm font-bold rounded-full bg-white text-green-600 shadow-lg"></span>
                </div>
            </div>
            
            <!-- Event Content -->
            <div class="p-6">
                <!-- Organization -->
                <div id="overlayOrganization" class="flex items-center gap-3 mb-4 pb-4 border-b border-gray-200">
                    <div id="overlayOrgIcon" class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold"></div>
                    <div>
                        <p class="text-sm text-gray-500">Organized by</p>
                        <p id="overlayOrgName" class="font-semibold text-gray-800"></p>
                    </div>
                </div>
                
                <!-- Description -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">About This Event</h3>
                    <p id="overlayDesc" class="text-gray-600 leading-relaxed"></p>
                </div>
                
                <!-- Event Details Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <!-- Date & Time -->
                    <div class="bg-blue-50 p-4 rounded-lg">
                        <h4 class="font-semibold text-blue-800 mb-2 flex items-center gap-2">
                            <span>📅</span> Date & Time
                        </h4>
                        <p id="overlayDate" class="text-sm text-blue-700 font-medium"></p>
                        <p id="overlayTime" class="text-sm text-blue-600"></p>
                    </div>
                    
                    <!-- Location -->
                    <div class="bg-purple-50 p-4 rounded-lg">
                        <h4 class="font-semibold text-purple-800 mb-2 flex items-center gap-2">
                            <span>📍</span> Location
                        </h4>
                        <p id="overlayVenue" class="text-sm text-purple-700 font-medium"></p>
                        <p id="overlayBuilding" class="text-sm text-purple-600"></p>
                    </div>
                    
                    <!-- Capacity -->
                    <div id="overlayCapacitySection" class="bg-green-50 p-4 rounded-lg">
                        <h4 class="font-semibold text-green-800 mb-2 flex items-center gap-2">
                            <span>👥</span> Capacity
                        </h4>
                        <p id="overlayCapacity" class="text-sm text-green-700 font-medium"></p>
                    </div>
                    
                    <!-- Registration -->
                    <div class="bg-amber-50 p-4 rounded-lg">
                        <h4 class="font-semibold text-amber-800 mb-2 flex items-center gap-2">
                            <span>📝</span> Registration
                        </h4>
                        <p id="overlayRegistration" class="text-sm text-amber-700 font-medium"></p>
                    </div>
                </div>
                
                <!-- Tags -->
                <div id="overlayTagsSection" class="mb-6">
                    <div id="overlayTags" class="flex flex-wrap gap-2"></div>
                </div>
                
                <!-- Contact & Website -->
                <div id="overlayLinksSection" class="mb-6 space-y-2">
                    <div id="overlayContactSection" class="hidden">
                        <a id="overlayContact" href="#" class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-800 text-sm font-medium">
                            📧 Contact Organizer
                        </a>
                    </div>
                    <div id="overlayWebsiteSection" class="hidden">
                        <a id="overlayWebsite" href="#" target="_blank" class="inline-flex items-center gap-2 text-purple-600 hover:text-purple-800 text-sm font-medium">
                            🔗 Event Website
                        </a>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t border-gray-200">
                    <button id="bookEventBtn" class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold py-3 px-6 rounded-lg hover:from-blue-700 hover:to-purple-700 transform hover:scale-[1.02] transition-all shadow-lg hover:shadow-xl">
                        🎫 Book Now
                    </button>
                    <button id="shareEventBtn" class="bg-gray-100 text-gray-700 font-semibold py-3 px-6 rounded-lg hover:bg-gray-200 transition-colors">
                        📤 Share Event
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
