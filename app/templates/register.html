<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../static/css/register.css">
    <title>Register - CampusConnect</title>
</head>
<body id="register-page" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-700 to-gray-900 font-sans">

    <a href="./organizerRegister.html" class="btn text-[10px] font-bold w-40 h-1 absolute right-5 top-5 pb-7 px-3">
        Become Organizer
    </a>
    <div class="bg-white w-full max-w-md p-8 rounded-md shadow-lg">
        <h2 class="text-2xl text-center mb-6 font-bold text-gray-800">
            Register to CampusConnect
        </h2>

        <div id="alert" class="hidden mb-4 p-3 rounded text-sm"></div>

        <div id="successMessage" class="hidden mb-4 p-3 bg-green-100 text-green-700 rounded text-sm">
            Registration successful! Redirecting...
        </div>

        <div class="space-y-4">
            <div>
                <h3 class="text-sm font-medium text-gray-700 mb-1">
                    Email Address
                </h3>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>

            <div>
                <h3 class="text-sm font-medium text-gray-700 mb-1">
                    Password
                </h3>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    minlength="8"
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>

            <button
                type="button"
                id="submit"
                class="w-full py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition duration-200 font-medium"
            >
                Register
            </button>

            <p class="text-center text-sm text-gray-600 mt-4">
                Already have an account?
                <a href="login.html" class="text-blue-600 hover:text-blue-800">Login here</a>
            </p>
        </div>
    </div>
    <button class="back-btn fixed top-4 left-5" onclick="window.location.href='./login.html'">
    <svg height="16" width="16" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1024 1024"><path d="M874.690416 495.52477c0 11.2973-9.168824 20.466124-20.466124 20.466124l-604.773963 0 188.083679 188.083679c7.992021 7.992021 7.992021 20.947078 0 28.939099-4.001127 3.990894-9.240455 5.996574-14.46955 5.996574-5.239328 0-10.478655-1.995447-14.479783-5.996574l-223.00912-223.00912c-3.837398-3.837398-5.996574-9.046027-5.996574-14.46955 0-5.433756 2.159176-10.632151 5.996574-14.46955l223.019353-223.029586c7.992021-7.992021 20.957311-7.992021 28.949332 0 7.992021 8.002254 7.992021 20.957311 0 28.949332l-188.073446 188.073446 604.753497 0C865.521592 475.058646 874.690416 484.217237 874.690416 495.52477z"></path></svg>
    <span>Back</span>
    </button>
    <script src="../static/js/user.js" defer></script>

</body>
</html>
